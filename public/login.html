<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0a0a0a;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* Background video — fills viewport, sits under card */
.lp-bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}
/* Dark scrim above the video for visual consistency with the card */
.lp-bg-scrim {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: rgba(0,0,0,0.35);
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce), (prefers-reduced-data: reduce) {
  .lp-bg-video { display: none; }
}

.lp-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  background: rgba(20,20,20,0.95);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 32px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
@media (min-width: 768px) {
  .lp-card { padding: 40px 36px; }
}

.lp-logo { display: block; width: 200px; max-width: 70%; height: auto; margin: 0 auto 24px; }
@media (min-width: 768px) { .lp-logo { width: 240px; margin-bottom: 28px; } }

.lp-h1 {
  font-size: 22px;
  line-height: 1.25;
  font-weight: 800;
  text-align: center;
  margin: 0 0 24px;
  letter-spacing: -0.01em;
}
.lp-h1-accent { color: #F17BB6; }
@media (min-width: 768px) { .lp-h1 { font-size: 26px; margin-bottom: 28px; } }

.lp-field { margin: 0 0 14px; }
.lp-input {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  font-family: inherit;
  color: #fff;
  background: #0f0f0f;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
.lp-input::placeholder { color: rgba(255,255,255,0.35); }
.lp-input:focus {
  border-color: #F17BB6;
  box-shadow: 0 0 0 3px rgba(241,123,182,0.18);
}

.lp-error {
  display: none;
  font-size: 13px;
  color: #F17BB6;
  margin: -6px 0 12px;
  text-align: left;
}

.lp-submit {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  color: #fff;
  background: #F17BB6;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s, transform 0.05s;
  -webkit-appearance: none;
}
.lp-submit:hover { background: #ec6aa9; }
.lp-submit:active { transform: translateY(1px); }
.lp-submit:disabled { opacity: 0.7; cursor: not-allowed; }
</style>
</head>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5VRS8QPJ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<video class="lp-bg-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true">
  <source src="https://vid.ourdream.ai/heartcloudsmall7.webm" type="video/webm">
</video>
<div class="lp-bg-scrim" aria-hidden="true"></div>

<main class="lp-card">
  <img class="lp-logo" src="/ourdreamnetworklogo.svg" alt="ourdreamnetwork">
  <h1 class="lp-h1">Enter Your Email For <span class="lp-h1-accent">50 bonus dreamcoins</span> on ourdream</h1>

  <form id="login-form" novalidate>
    <div class="lp-field">
      <input
        id="email"
        class="lp-input"
        type="email"
        name="email"
        placeholder="your@email.com"
        autocomplete="email"
        inputmode="email"
        required
        aria-label="Email address">
    </div>
    <div id="login-error" class="lp-error" role="alert"></div>
    <button id="submit-btn" class="lp-submit" type="submit">Submit</button>
  </form>
</main>

</body>
