<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0a0a0a;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* Ambient background (ported from PAGE_CSS) */
.c3s-ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.c3s-ambient::before {
  content: ''; position: absolute; top: -20%; left: -10%; width: 60%; height: 60%;
  background: radial-gradient(ellipse, rgba(219,39,119,0.08) 0%, transparent 70%);
  animation: c3s-drift 20s ease-in-out infinite;
}
.c3s-ambient::after {
  content: ''; position: absolute; bottom: -20%; right: -10%; width: 50%; height: 50%;
  background: radial-gradient(ellipse, rgba(219,39,119,0.06) 0%, transparent 70%);
  animation: c3s-drift 25s ease-in-out infinite reverse;
}
@keyframes c3s-drift {
  0%, 100% { transform: translate(0,0); }
  33% { transform: translate(5%,-3%); }
  66% { transform: translate(-3%,5%); }
}
@keyframes c3s-stepIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes c3s-stepOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
@keyframes c3s-fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes c3s-spin { to { transform: rotate(360deg); } }
.c3s-step-enter { animation: c3s-stepIn 0.4s ease forwards; }
.c3s-step-exit  { animation: c3s-stepOut 0.2s ease forwards; }

/* Layout — body flexes vertically so trust + footer sit at the viewport bottom without scrolling */
#root { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.c3s-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 12px 16px 8px; max-width: 520px; margin: 0 auto; width: 100%; }
@media (min-width: 768px) { .c3s-container { padding: 16px 24px 12px; max-width: 700px; } }

/* Header (logo + stats counter) — full viewport width, sits above .c3s-container */
.c3s-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 16px; flex: 0 0 auto; box-sizing: border-box; }
.c3s-logo { display: inline-block; width: 180px; opacity: 0.95; transition: opacity 0.2s; text-decoration: none; }
.c3s-logo:hover { opacity: 1; }
.c3s-logo svg { width: 100%; height: auto; display: block; }
.c3s-stats { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.55); white-space: nowrap; }
.c3s-stats-dot { width: 8px; height: 8px; border-radius: 50%; background: #ec4899; box-shadow: 0 0 6px rgba(236,72,153,0.7); flex: 0 0 auto; }
.c3s-stats-num { color: #fff; font-weight: 600; }
@media (min-width: 768px) { .c3s-header { padding: 16px 32px; } .c3s-logo { width: 240px; } .c3s-stats { font-size: 14px; } }

/* Step indicator (text + optional back button on left) */
.c3s-step-indicator { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 24px; margin: 4px 0 10px; gap: 8px; }
.c3s-step-indicator-text { grid-column: 2; display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; color: rgba(255,255,255,0.55); text-transform: uppercase; }
.c3s-step-indicator-text::before, .c3s-step-indicator-text::after { content: ''; flex: 0 0 24px; height: 1px; background: rgba(255,255,255,0.2); }
.c3s-back-btn { grid-column: 1; justify-self: start; display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: rgba(255,255,255,0.7); padding: 4px 6px; text-transform: uppercase; }
.c3s-back-btn:hover { color: #fff; }

/* Headings (centered) */
.c3s-h1 { font-size: 28px; line-height: 1.15; font-weight: 800; text-align: center; margin: 0 0 8px; letter-spacing: -0.01em; }
.c3s-h1-accent { color: #ec4899; }
.c3s-h2 { font-size: 15px; font-weight: 400; text-align: center; color: rgba(255,255,255,0.55); margin: 0 0 18px; }
@media (min-width: 768px) { .c3s-h1 { font-size: 34px; } .c3s-h2 { font-size: 16px; } }

/* Trust badges (bottom row, pinned to viewport bottom via body flex layout) */
.c3s-trust { display: flex; align-items: center; justify-content: space-around; gap: 12px; padding: 10px 16px 6px; max-width: 520px; margin: 0 auto; width: 100%; flex: 0 0 auto; }
.c3s-trust-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.45); }
.c3s-trust-item svg { width: 14px; height: 14px; flex: 0 0 auto; opacity: 0.7; }
@media (min-width: 768px) { .c3s-trust { max-width: 700px; padding: 14px 24px 8px; } .c3s-trust-item { font-size: 13px; } }

/* Style picker (Step 1) — fixed-aspect cards, ~1:2 portrait, breathing room above the fold below */
.c3s-style-grid { display: flex; gap: 12px; width: 100%; }
.c3s-style-card { position: relative; flex: 1; min-width: 0; aspect-ratio: 1/2; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); transition: border-color 0.2s, transform 0.15s; background: #1a1a1a; }
@media (min-width: 768px) { .c3s-style-card { aspect-ratio: 2/3; } }
.c3s-style-card:hover, .c3s-style-card:focus-visible { border-color: rgba(236,72,153,0.5); transform: translateY(-2px); }
.c3s-style-card video, .c3s-style-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c3s-style-card-label { position: absolute; bottom: 12px; left: 12px; right: auto; font-size: 14px; font-weight: 600; color: #fff; text-align: left; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }

/* Pick grid (Step 2 sub-component) */
.c3s-pick-section { width: 100%; margin-bottom: 10px; }
.c3s-pick-title { font-size: 11px; font-weight: 700; margin: 0 0 6px; letter-spacing: 0.15em; }
.c3s-pick-title-name { color: rgba(255,255,255,0.75); text-transform: uppercase; }
.c3s-pick-title-hint { color: rgba(255,255,255,0.4); margin-left: 6px; font-weight: 500; letter-spacing: 0.02em; text-transform: none; }
.c3s-pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.c3s-pick-card { position: relative; aspect-ratio: 4/5; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid rgba(255,255,255,0.08); transition: border-color 0.15s, transform 0.1s; background: #1a1a1a; }
@media (min-width: 768px) {
  .c3s-pick-grid { grid-template-columns: repeat(3, 160px); justify-content: center; gap: 16px; }
  .c3s-pick-card { aspect-ratio: 1/1; }
}
.c3s-pick-card:hover { border-color: rgba(236,72,153,0.4); }
.c3s-pick-card.is-selected { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236,72,153,0.25); }
.c3s-pick-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c3s-pick-card-label { position: absolute; bottom: 6px; left: 8px; right: auto; font-size: 12px; font-weight: 600; color: #fff; text-align: left; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

/* Personality (Step 3) — 2x2 grid that fills available height */
.c3s-persona-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; width: 100%; flex: 1; min-height: 0; }
.c3s-persona-card { position: relative; min-width: 0; min-height: 0; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,0.1); background: #1a1a1a; cursor: pointer; transition: border-color 0.2s, transform 0.15s; }
.c3s-persona-card:hover { border-color: rgba(236,72,153,0.4); transform: translateY(-1px); }
.c3s-persona-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c3s-persona-card::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); pointer-events: none; }
.c3s-persona-meta { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 1; text-align: left; }
.c3s-persona-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 2px; text-align: left; }
.c3s-persona-vibe { font-size: 10px; color: rgba(255,255,255,0.75); line-height: 1.3; text-align: left; }

/* Primary CTA */
.c3s-cta {
  display: block; width: 100%; padding: 16px 24px; border: none; border-radius: 12px;
  background: linear-gradient(90deg, #ec4899, #db2777); color: #fff;
  font-size: 18px; font-weight: 700; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
  margin-top: 8px;
}
.c3s-cta:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(236,72,153,0.35); }
.c3s-cta:disabled { opacity: 0.6; cursor: not-allowed; }
.c3s-cta-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: c3s-spin 0.7s linear infinite; vertical-align: middle; margin-left: 8px; }

/* Email gate (overlay) */
.c3s-gate { position: fixed; inset: 0; z-index: 100; background: rgba(10,10,10,0.92); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: c3s-fadeIn 0.25s ease; }
.c3s-gate-card { width: 100%; max-width: 420px; background: rgba(20,20,20,0.85); border: 1px solid rgba(236,72,153,0.25); border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.c3s-gate-h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; text-align: center; }
.c3s-gate-sub { font-size: 14px; color: rgba(255,255,255,0.6); text-align: center; margin: 0 0 20px; }
.c3s-gate-input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 16px; outline: none; transition: border-color 0.15s; }
.c3s-gate-input:focus { border-color: #ec4899; }
.c3s-gate-error { display: none; color: #ef4444; font-size: 13px; margin-top: 8px; }
.c3s-gate-error.is-shown { display: block; }
.c3s-gate-back { display: inline-block; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.5); cursor: pointer; background: none; border: none; padding: 0; }
.c3s-gate-back:hover { color: rgba(255,255,255,0.8); }
.c3s-gate-legal { font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: 16px; }
.c3s-gate-legal a { color: rgba(255,255,255,0.6); text-decoration: underline; }

/* Legal footer */
.legal-footer { padding: 6px 16px 10px; text-align: center; position: relative; z-index: 1; flex: 0 0 auto; }
.legal-footer a { color: rgba(255,255,255,0.4); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 12px; text-decoration: none; }
.legal-footer a:hover { color: rgba(255,255,255,0.8); }

/* Visibility helper for steps — active step flexes vertically so its grid can fill remaining height */
.c3s-step { display: none; width: 100%; }
.c3s-step.is-active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
</style>
</head>

    params.set('sub13', q.get('Q10') || 'Athletic');   // → Q10
    params.set('sub14', 'ASMR');                       // → Q12 (legacy default; quiz has no Q12)
    params.set('sub15', q.get('Q13') || 'Sweet');      // → Q13
    params.set('sub16', q.get('Q15') || 'Crush');      // → Q15
    params.set('sub17', q.get('Q18') || 'true');       // → Q18
    params.set('sub18', q.get('s')   || '6');          // → s
    if (gl) params.set('sub19', gl);                   // → _gl
    params.set('clickid', decodeURIComponent(cookieMatch[1]));
    url = atob(REDTRACK_BASE_B64) + '?' + params.toString();
  } else {
    // Organic path — skip RedTrack, go direct to ourdream.ai/create with full Q-data.
    q.forEach((v, k) => { if (!params.has(k)) params.set(k, v); });
    params.set('ref', 'googlecpc'); // override any ref from qParams; keep paid attribution consistent
    url = 'https://ourdream.ai/create?' + params.toString();
  }

  track('quiz_redirect', { redirect_url: url, has_clickid: !!cookieMatch });

  // Paid path carries _gl via sub19 already; only organic path needs linker decoration on the final URL.
  const finalUrl = cookieMatch ? url : await getDecoratedUrl(url);
  window.location.href = finalUrl;
}

// ══════════════════════════════════════════════
//  TRACKING (verbatim port from quiz-old.html lines 610-636)
// ══════════════════════════════════════════════

window.dataLayer = window.dataLayer || [];

function track(eventName, params) {
  const data = { event: eventName, ...params };
  window.dataLayer.push(data);
  console.log('[dataLayer]', data);
}

function getDecoratedUrl(baseUrl) {
  return new Promise((resolve) => {
    // Create a temporary anchor and let GTM's cross-domain linker decorate it
    const a = document.createElement('a');
    a.href = baseUrl;
    a.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(a);

    // GTM decorates links on mousedown — trigger it
    a.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));

    // Give GTM a tick to decorate, then read the href
    setTimeout(() => {
      const decoratedUrl = a.href;
      document.body.removeChild(a);
      resolve(decoratedUrl);
    }, 100);
  });
}

// Decorate a dummy ourdream.ai link, then extract just the _gl payload — used as
// sub19 on the paid path so the value survives RedTrack's /click/1 hop.
function getGlValue() {
  return new Promise((resolve) => {
    const a = document.createElement('a');
    a.href = 'https://ourdream.ai/';
    a.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(a);
    a.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
    setTimeout(() => {
      const match = a.href.match(/[?&]_gl=([^&]+)/);
      document.body.removeChild(a);
      resolve(match ? decodeURIComponent(match[1]) : '');
    }, 100);
  });
}
