<title>ourdream — Character Builder</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ec4899;
    --pink-glow: rgba(236, 72, 153, 0.6);
    --pink-dim: rgba(236, 72, 153, 0.15);
    --dark: #0a0a0f;
    --darker: #06060a;
    --cyan: #06b6d4;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--pink); color: #000; }

  body {
    background: var(--darker);
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: 'Rajdhani', sans-serif;
  }

  #app {
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 0%, rgba(236,72,153,0.06) 0%, var(--dark) 50%, var(--darker) 100%);
    position: relative;
  }

  /* ── CRT Overlay ── */
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
  }
  .crt-overlay::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  }

  /* ── Screen Flash ── */
  .screen-flash {
    position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    background: var(--pink); opacity: 0; transition: opacity 0.08s ease-out;
  }
  .screen-flash.active { opacity: 0.3; }

  /* ── Particles ── */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute; bottom: -10px; border-radius: 50%;
    background: var(--pink);
    animation: floatUp var(--dur) var(--delay) infinite linear;
  }

  /* ── Screens ── */
  .screen {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px; gap: 36px;
    position: relative; z-index: 1;
    opacity: 0; transform: translateY(30px);
    animation: screenIn 0.5s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .screen.exit {
    animation: screenOut 0.25s ease-in forwards;
  }

  /* ── Glitch Text ── */
  .glitch {
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan), 0 0 20px var(--pink-glow);
    text-align: center;
  }
  .glitch-title { font-size: clamp(28px, 6vw, 48px); line-height: 1.3; }
  .glitch-heading { font-size: clamp(16px, 4vw, 24px); }
  .glitch-question { font-size: clamp(13px, 3.5vw, 18px); line-height: 1.5; }
  .glitch-reveal { font-size: clamp(18px, 5vw, 28px); }
  .glitch-name { font-size: 22px; margin-bottom: 8px; }

  /* ── Subtitle ── */
  .subtitle {
    font-family: 'Rajdhani', sans-serif; font-weight: 400;
    font-size: 13px; color: rgba(255,255,255,0.25);
    text-align: center; letter-spacing: 6px; text-transform: uppercase;
  }
  .subtitle-small {
    font-family: 'Rajdhani', sans-serif; font-size: 12px;
    color: rgba(255,255,255,0.2); text-align: center;
    letter-spacing: 4px;
  }

  /* ── System Label ── */
  .sys-label {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: var(--pink); letter-spacing: 3px; text-align: center;
    text-shadow: 0 0 10px var(--pink-glow); margin-bottom: 12px;
  }

  /* ── Boot Text ── */
  .boot-text {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    color: rgba(255,255,255,0.15); text-align: center; line-height: 2.2;
    opacity: 0; animation: fadeIn 0.5s 0.6s forwards;
  }

  /* ── Credits ── */
  .credits {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: rgba(255,255,255,0.12); text-align: center;
    opacity: 0; animation: fadeIn 0.4s 0.8s forwards;
  }

  /* ── Legal Footer ── */
  .legal-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    text-align: center; padding: 10px 16px;
    z-index: 100; pointer-events: none;
  }
  .legal-footer a {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: rgba(255,255,255,0.15); text-decoration: none;
    letter-spacing: 2px; margin: 0 12px;
    pointer-events: auto; transition: color 0.2s;
  }
  .legal-footer a:hover { color: var(--pink); }

  /* ── Logo container ── */
  .logo-wrap {
    opacity: 0; transform: translateY(20px) scale(0.9);
    animation: logoIn 0.6s 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* ── Arcade Button ── */
  .arcade-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px; padding: 14px 32px;
    background: transparent; color: #fff;
    border: 2px solid var(--pink); cursor: pointer;
    text-transform: uppercase; letter-spacing: 2px;
    box-shadow: 0 0 10px rgba(236,72,153,0.2);
    transition: all 0.1s; position: relative; outline: none;
  }
  .arcade-btn:hover {
    background: rgba(236,72,153,0.15);
    box-shadow: 0 0 30px var(--pink-glow), inset 0 0 30px rgba(236,72,153,0.1);
    transform: scale(1.03);
  }
  .arcade-btn:active { background: var(--pink); color: #000; transform: scale(0.96); }
  .arcade-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .arcade-btn.large { font-size: 16px; padding: 20px 48px; }

  .blink { animation: blink 1.2s infinite; }

  /* ── Back Button ── */
  .back-btn {
    position: absolute; top: 20px; left: 20px; z-index: 50;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: rgba(255,255,255,0.3); background: none; border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px; cursor: pointer; transition: all 0.15s; outline: none;
  }
  .back-btn:hover { color: var(--pink); border-color: var(--pink); }

  /* ── Mode Cards ── */
  .mode-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 380px; }
  .mode-card {
    width: 100%; padding: 24px 20px; background: rgba(255,255,255,0.02);
    border: 2px solid rgba(255,255,255,0.08); cursor: pointer;
    display: flex; align-items: center; gap: 16px;
    transition: all 0.15s; position: relative; overflow: hidden; outline: none;
    opacity: 0; transform: translateX(-30px);
    animation: slideInLeft 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .mode-card:nth-child(1) { animation-delay: 0.2s; }
  .mode-card:nth-child(2) { animation-delay: 0.28s; }
  .mode-card:nth-child(3) { animation-delay: 0.36s; }
  .mode-card:nth-child(4) { animation-delay: 0.44s; }

  .mode-card:hover {
    background: rgba(236,72,153,0.08); border-color: var(--pink);
    transform: translateX(8px);
    box-shadow: 0 0 25px var(--pink-glow), inset 0 0 25px rgba(236,72,153,0.05);
  }
  .mode-card.selected {
    background: linear-gradient(135deg, rgba(236,72,153,0.2) 0%, rgba(236,72,153,0.05) 100%);
    border-color: var(--pink); transform: translateX(8px);
    box-shadow: 0 0 25px var(--pink-glow), inset 0 0 25px rgba(236,72,153,0.05);
  }
  .mode-card.selected::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--pink); box-shadow: 0 0 15px var(--pink);
  }
  .mode-icon { font-size: 28px; transition: filter 0.15s; filter: grayscale(0.5); }
  .mode-card:hover .mode-icon, .mode-card.selected .mode-icon { filter: none; }
  .mode-title {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px;
    color: rgba(255,255,255,0.7); letter-spacing: 1px; transition: color 0.15s;
  }
  .mode-card:hover .mode-title, .mode-card.selected .mode-title { color: var(--pink); }
  .mode-subtitle {
    font-family: 'Rajdhani', sans-serif; font-size: 13px;
    color: rgba(255,255,255,0.35); margin-top: 4px; letter-spacing: 0.5px;
  }
  .mode-arrow {
    margin-left: auto; font-family: 'Press Start 2P', monospace;
    font-size: 8px; color: var(--pink); text-shadow: 0 0 10px var(--pink-glow);
    display: none;
  }
  .mode-card.selected .mode-arrow { display: block; }

  /* ── Gender Cards ── */
  .gender-grid {
    display: flex; gap: 16px; width: 100%; max-width: 460px; justify-content: center;
  }
  .gender-card {
    flex: 1; max-width: 210px; background: rgba(255,255,255,0.02);
    border: 2px solid rgba(255,255,255,0.08); cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    padding: 0; overflow: hidden; transition: all 0.2s; outline: none;
    opacity: 0; transform: translateY(20px);
    animation: slideInLeft 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .gender-card:nth-child(1) { animation-delay: 0.2s; }
  .gender-card:nth-child(2) { animation-delay: 0.35s; }
  .gender-img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover;
    filter: grayscale(0.3) brightness(0.8);
    transition: all 0.3s;
    pointer-events: none;
  }
  .gender-card:hover .gender-img {
    filter: grayscale(0) brightness(1);
  }
  .gender-card:hover {
    border-color: var(--pink);
    box-shadow: 0 0 30px var(--pink-glow);
    transform: translateY(-4px);
  }
  .gender-card.selected {
    border-color: var(--pink);
    box-shadow: 0 0 30px var(--pink-glow), inset 0 0 30px rgba(236,72,153,0.05);
  }
  .gender-card.selected .gender-img {
    filter: grayscale(0) brightness(1);
  }
  .gender-label {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px;
    color: rgba(255,255,255,0.6); letter-spacing: 3px; padding: 14px 0;
    transition: color 0.2s; pointer-events: none;
  }
  .gender-card:hover .gender-label,
  .gender-card.selected .gender-label { color: var(--pink); }

  /* ── Choice Cards ── */
  .choice-list { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 400px; }
  .choice-card {
    width: 100%; padding: 18px 20px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06); cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    transition: all 0.12s; outline: none;
    opacity: 0; transform: translateX(-20px);
    animation: slideInLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .choice-card:nth-child(1) { animation-delay: 0.2s; }
  .choice-card:nth-child(2) { animation-delay: 0.26s; }
  .choice-card:nth-child(3) { animation-delay: 0.32s; }
  .choice-card:nth-child(4) { animation-delay: 0.38s; }

  .choice-card:hover {
    transform: translateX(6px); border-color: var(--pink);
  }
  .choice-card.selected {
    background: linear-gradient(90deg, rgba(236,72,153,0.15) 0%, transparent 100%);
    border-color: var(--pink); transform: translateX(6px);
    box-shadow: 0 0 20px rgba(236,72,153,0.15);
  }
  .choice-key {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: rgba(255,255,255,0.2); width: 24px; transition: all 0.12s; text-align: center;
  }
  .choice-card:hover .choice-key, .choice-card.selected .choice-key {
    color: var(--pink); text-shadow: 0 0 8px var(--pink-glow);
  }
  .choice-label {
    font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px;
    color: rgba(255,255,255,0.55); letter-spacing: 0.5px; transition: color 0.12s;
  }
  .choice-card:hover .choice-label, .choice-card.selected .choice-label { color: #fff; }
  .choice-star {
    margin-left: auto; font-family: 'Press Start 2P', monospace;
    font-size: 7px; color: var(--pink); display: none;
  }
  .choice-card.selected .choice-star { display: block; }

  /* ── XP Bar ── */
  .xp-bar-wrap {
    width: 100%; max-width: 400px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }
  .xp-label {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: var(--pink); white-space: nowrap;
  }
  .xp-track {
    flex: 1; height: 6px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), #f472b6);
    box-shadow: 0 0 10px var(--pink-glow);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .xp-count {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: rgba(255,255,255,0.3);
  }

  /* ── Combo Counter ── */
  .combo {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    font-family: 'Press Start 2P', monospace; text-align: right;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .combo.active { opacity: 1; }
  .combo-label { font-size: 7px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
  .combo-count { font-size: 18px; color: var(--pink); text-shadow: 0 0 15px var(--pink-glow); }
  .combo.pop .combo-count { animation: comboPulse 0.3s ease-out; }

  /* ── Reveal Card ── */
  .reveal-card {
    width: 100%; max-width: 340px;
    background: rgba(255,255,255,0.02);
    border: 2px solid var(--pink);
    box-shadow: 0 0 40px rgba(236,72,153,0.15), inset 0 0 40px rgba(236,72,153,0.03);
    padding: 36px 28px; text-align: center; position: relative; overflow: hidden;
    opacity: 0; transform: translateY(30px) scale(0.9);
    animation: cardReveal 0.6s 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .corner {
    position: absolute; width: 12px; height: 12px; opacity: 0.5;
  }
  .corner-tl { top: 8px; left: 8px; border-top: 1px solid var(--pink); border-left: 1px solid var(--pink); }
  .corner-tr { top: 8px; right: 8px; border-top: 1px solid var(--pink); border-right: 1px solid var(--pink); }
  .corner-bl { bottom: 8px; left: 8px; border-bottom: 1px solid var(--pink); border-left: 1px solid var(--pink); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 1px solid var(--pink); border-right: 1px solid var(--pink); }

  .avatar-circle {
    width: 80px; height: 80px; margin: 0 auto 20px;
    border: 2px solid var(--pink); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%);
    box-shadow: 0 0 20px var(--pink-glow);
  }
  .avatar-letter {
    font-family: 'Press Start 2P', monospace; font-size: 20px;
    color: var(--pink); text-shadow: 0 0 10px var(--pink-glow);
  }
  .archetype-trait {
    font-family: 'Orbitron', sans-serif; font-size: 11px;
    color: var(--pink); letter-spacing: 2px; margin-bottom: 16px; font-weight: 700;
  }
  .archetype-desc {
    font-family: 'Rajdhani', sans-serif; font-size: 14px;
    color: rgba(255,255,255,0.45); line-height: 1.6;
  }

  /* ── Stat Bars ── */
  .stat-bars { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
  .stat-row { display: flex; align-items: center; gap: 8px; }
  .stat-label {
    font-family: 'Press Start 2P', monospace; font-size: 6px;
    color: rgba(255,255,255,0.3); width: 40px; text-align: right;
  }
  .stat-track { flex: 1; height: 4px; background: rgba(255,255,255,0.05); }
  .stat-fill {
    height: 100%; background: linear-gradient(90deg, var(--pink), #f9a8d4);
    box-shadow: 0 0 6px var(--pink-glow);
    width: 0; transition: width 0.8s 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .stat-val {
    font-family: 'Press Start 2P', monospace; font-size: 6px;
    color: var(--pink); width: 24px;
  }

  /* ── Match Found ── */
  .match-found {
    font-family: 'Press Start 2P', monospace; font-size: 8px;
    color: var(--pink); letter-spacing: 4px; text-align: center;
    text-shadow: 0 0 15px var(--pink-glow);
    opacity: 0; transform: scale(1.5);
    animation: matchIn 0.5s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* ── Email Screen ── */
  .email-wrap {
    width: 100%; max-width: 380px; text-align: center;
  }
  .email-input {
    width: 100%; padding: 16px 20px;
    font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px;
    background: rgba(255,255,255,0.03); color: #fff;
    border: 2px solid rgba(255,255,255,0.1);
    outline: none; letter-spacing: 0.5px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .email-input::placeholder { color: rgba(255,255,255,0.2); }
  .email-input:focus {
    border-color: var(--pink);
    box-shadow: 0 0 20px rgba(236,72,153,0.15);
  }
  .email-hint {
    font-family: 'Press Start 2P', monospace; font-size: 6px;
    color: rgba(255,255,255,0.15); margin-top: 12px;
  }
  .email-error {
    font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: #f87171; margin-top: 8px; min-height: 16px;
  }
  .consent-label {
    display: flex; align-items: flex-start; gap: 10px;
    margin-top: 16px; cursor: pointer; text-align: left;
  }
  .consent-checkbox {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; min-width: 18px;
    border: 2px solid rgba(255,255,255,0.2); background: transparent;
    cursor: pointer; margin-top: 1px; position: relative;
    transition: all 0.15s;
  }
  .consent-checkbox:checked {
    border-color: var(--pink); background: var(--pink);
  }
  .consent-checkbox:checked::after {
    content: '✓'; position: absolute; top: -1px; left: 2px;
    font-size: 12px; color: #000; font-weight: bold;
  }
  .consent-text {
    font-family: 'Rajdhani', sans-serif; font-size: 13px;
    color: rgba(255,255,255,0.45); line-height: 1.4;
  }
  .email-disclosure {
    font-family: 'Rajdhani', sans-serif; font-size: 12px;
    color: rgba(255,255,255,0.3); margin-top: 12px; line-height: 1.5;
  }

  /* ── CTA wrap ── */
  .cta-wrap {
    text-align: center;
    opacity: 0; animation: fadeIn 0.4s 1.4s forwards;
  }
  .cta-hint {
    font-family: 'Press Start 2P', monospace; font-size: 6px;
    color: rgba(255,255,255,0.15); margin-top: 16px;
  }

  /* ── REVEAL for adventure/play ── */
  .alt-reveal-desc {
    font-family: 'Rajdhani', sans-serif; font-size: 15px;
    color: rgba(255,255,255,0.4); text-align: center;
    max-width: 320px; line-height: 1.6;
  }

  /* ── Teleport Screen ── */
  .teleport-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .teleport-icon {
    font-size: 48px;
    animation: teleportPulse 0.6s ease-in-out infinite alternate;

window.dataLayer = window.dataLayer || [];

function track(eventName, params) {
  const data = { event: eventName, ...params };
  window.dataLayer.push(data);
  console.log('[dataLayer]', data);
}

function getDecoratedUrl(baseUrl) {
  return new Promise((resolve) => {
    // Create a temporary anchor and let GTM's cross-domain linker decorate it
    const a = document.createElement('a');
    a.href = baseUrl;
    a.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(a);

    // GTM decorates links on mousedown — trigger it
    a.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));

    // Give GTM a tick to decorate, then read the href
    setTimeout(() => {
      const decoratedUrl = a.href;
      document.body.removeChild(a);
      resolve(decoratedUrl);
    }, 100);
  });
}

function pushState(nextScreen) {
  state.history.push({
    screen: state.screen,
    mode: state.mode,
    questionIndex: state.questionIndex,
    answers: [...state.answers],
    email: state.email
  });
  state.screen = nextScreen;
}

function goBack() {
  if (state.history.length === 0) return;
  posthog.capture('back_button_clicked', { from_screen: state.screen, mode: state.mode });
  const prev = state.history.pop();
  state.screen = prev.screen;
  state.mode = prev.mode;
  state.questionIndex = prev.questionIndex;
  state.answers = prev.answers;
  state.email = prev.email;
  flash();
  render();
}

}

function updateCombo() {
  const now = Date.now();
  if (now - state.lastAnswerTime < 3000) {
    state.combo++;
  } else {
    state.combo = 1;
  }
  state.lastAnswerTime = now;

  const comboEl = document.getElementById('combo');
  const countEl = document.getElementById('comboCount');
  if (state.combo >= 2) {
    comboEl.classList.add('active');
    countEl.textContent = '×' + state.combo;
    comboEl.classList.remove('pop');
    void comboEl.offsetWidth;
    comboEl.classList.add('pop');
  } else {
    comboEl.classList.remove('active');
  }
}

function isValidEmail(email) {

}

  const email = state.email.trim();

    posthog.capture('email_validation_failed', { reason: 'empty', mode: state.mode });

    document.getElementById('emailInput').style.animation = 'shakeSm 0.3s';
    setTimeout(() => { document.getElementById('emailInput').style.animation = ''; }, 300);
    return;

  if (!isValidEmail(email)) {
    posthog.capture('email_validation_failed', { reason: 'invalid_format', mode: state.mode });
    document.getElementById('emailError').textContent = 'INVALID EMAIL FORMAT';
    document.getElementById('emailInput').style.animation = 'shakeSm 0.3s';
    setTimeout(() => { document.getElementById('emailInput').style.animation = ''; }, 300);
    return;
  }

  // Save email entry
  saveEmail(email);

  const marketingConsent = document.getElementById('marketingConsent').checked;
  track('quiz_email_submitted', {
    quiz_mode: state.mode,
    marketing_consent: marketingConsent ? 'yes' : 'no'
  });

  posthog.identify(email, {
    quiz_mode: state.mode,
    marketing_consent: marketingConsent
  });
  posthog.capture('email_submitted', {
    mode: state.mode,
    marketing_consent: marketingConsent
  });

  // Google Ads native conversion event
  window.dataLayer.push({
    event: 'generate_lead',
    currency: 'USD',
    value: 1.0,
    user_data: {
      email: email
    }
  });

  flash();

  // Go to reveal screen
  pushState('reveal');
  render();
}

function scheduleRedirect() {
  const hasGender = state.mode === 'companion' || state.mode === 'romance';
  const personality = hasGender ? (state.answers[1] || '') : (state.answers[0] || '');
  const modeArchetypes = ARCHETYPES[state.mode] || ARCHETYPES.companion;
  const arch = modeArchetypes[personality] || Object.values(modeArchetypes)[0];

  track('quiz_match_revealed', {
    quiz_mode: state.mode,
    match_name: arch.name,
    match_trait: arch.trait
  });

  posthog.capture('match_revealed', {
    mode: state.mode,
    match_name: arch.name
  });
  posthog.setPersonProperties({
    archetype: arch.name,
    quiz_mode: state.mode
  });

  const isGamePath = state.mode === 'adventure' || state.mode === 'play';
  const _k = isGamePath
    ? 'aHR0cHM6Ly9vdXJkcmVhbS5haS9nYW1lcz9yZWY9Z29vZ2xlY3BjJm9kbmV0d29yaw=='
    : 'aHR0cHM6Ly9vdXJkcmVhbS5haS9jcmVhdGU/cmVmPWdvb2dsZWNwYyZvZG5ldHdvcms=';
  setTimeout(() => {
    let url = atob(_k);

    // Append Q-codes for /create path (companion/romance modes)
    if (!isGamePath) {
      const genderMap = { male: 'Male', female: 'Female' };
      const personalityMap = { playful: 'Playful', mysterious: 'Mysterious', caring: 'Caring', bold: 'Confident' };
      const relationshipMap = state.mode === 'romance'
        ? { intimate: 'Lover', dreamy: 'Crush', spontaneous: 'Stranger', comfort: 'Roommate' }
        : { deep: 'Lover', adventure: 'Stranger', cozy: 'Roommate', romantic: 'Crush' };

      const params = new URLSearchParams();
      var g = genderMap[state.answers[0]];
      if (g) params.set('Q1', g);
      params.set('Q10', 'Athletic');
      params.set('Q12', 'ASMR');
      var p = personalityMap[state.answers[1]];
      if (p) params.set('Q13', p);
      var r = relationshipMap[state.answers[2]];
      if (r) params.set('Q15', r);
      params.set('Q18', 'true');

      var qStr = params.toString();
      if (qStr) url += '&' + qStr;
    }

    track('quiz_redirect', {
      quiz_mode: state.mode,
      redirect_url: url
    });
    posthog.capture('redirected', {
      mode: state.mode,
      destination: url
    });
    getDecoratedUrl(url).then(function(finalUrl) {
      window.location.href = finalUrl;
    });
  }, 3000);
}

// ══════════════════════════════════════════════
//  EMAIL STORAGE
// ══════════════════════════════════════════════

function saveEmail(email) {
  const marketingConsent = document.getElementById('marketingConsent').checked;
  fetch('/api/save-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email,
      mode: state.mode,
      answers: [...state.answers],
      marketingConsent: marketingConsent
    })
  }).catch(err => console.error('Failed to save email:', err));
}
