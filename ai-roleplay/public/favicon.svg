<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>

  <!-- Pixel grid lines (subtle) -->
  <line x1="0" y1="8" x2="32" y2="8" stroke="#ec489910" stroke-width="0.3"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#ec489910" stroke-width="0.3"/>
  <line x1="0" y1="24" x2="32" y2="24" stroke="#ec489910" stroke-width="0.3"/>
  <line x1="8" y1="0" x2="8" y2="32" stroke="#ec489910" stroke-width="0.3"/>
  <line x1="16" y1="0" x2="16" y2="32" stroke="#ec489910" stroke-width="0.3"/>
  <line x1="24" y1="0" x2="24" y2="32" stroke="#ec489910" stroke-width="0.3"/>

  <!-- Back heart (larger, dimmer) -->
  <g filter="url(#glow)" opacity="0.45">
    <path d="M16 26 L6 16 Q3 12 6 9 Q9 6 12 9 L16 13 L20 9 Q23 6 26 9 Q29 12 26 16 Z"
          fill="none" stroke="#ec4899" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Front heart (pixel-style, bright) -->
  <g filter="url(#glow)">
    <!-- Pixel heart made of 2x2 blocks -->
    <!-- Row 1 -->
    <rect x="8"  y="10" width="2" height="2" fill="#ec4899"/>
    <rect x="10" y="10" width="2" height="2" fill="#ec4899"/>
    <rect x="16" y="10" width="2" height="2" fill="#ec4899"/>
    <rect x="18" y="10" width="2" height="2" fill="#ec4899"/>
    <!-- Row 2 -->
    <rect x="6"  y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="8"  y="12" width="2" height="2" fill="#f472b6"/>
    <rect x="10" y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="12" y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="14" y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="16" y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="18" y="12" width="2" height="2" fill="#ec4899"/>
    <rect x="20" y="12" width="2" height="2" fill="#ec4899"/>
    <!-- Row 3 -->
    <rect x="6"  y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="8"  y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="10" y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="12" y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="14" y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="16" y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="18" y="14" width="2" height="2" fill="#ec4899"/>
    <rect x="20" y="14" width="2" height="2" fill="#ec4899"/>
    <!-- Row 4 -->
    <rect x="8"  y="16" width="2" height="2" fill="#ec4899"/>
    <rect x="10" y="16" width="2" height="2" fill="#ec4899"/>
    <rect x="12" y="16" width="2" height="2" fill="#ec4899"/>
    <rect x="14" y="16" width="2" height="2" fill="#ec4899"/>
    <rect x="16" y="16" width="2" height="2" fill="#ec4899"/>
    <rect x="18" y="16" width="2" height="2" fill="#ec4899"/>
    <!-- Row 5 -->
    <rect x="10" y="18" width="2" height="2" fill="#ec4899"/>
    <rect x="12" y="18" width="2" height="2" fill="#ec4899"/>
    <rect x="14" y="18" width="2" height="2" fill="#ec4899"/>
    <rect x="16" y="18" width="2" height="2" fill="#ec4899"/>
    <!-- Row 6 -->
    <rect x="12" y="20" width="2" height="2" fill="#ec4899"/>
    <rect x="14" y="20" width="2" height="2" fill="#ec4899"/>
    <!-- Row 7 (tip) -->
    <rect x="13" y="22" width="2" height="2" fill="#ec4899"/>

    <!-- Highlight pixel (top-left shine) -->
    <rect x="8" y="12" width="2" height="2" fill="#fce7f3" opacity="0.6"/>
  </g>

  <!-- XP bar at bottom -->
  <rect x="4" y="27" width="24" height="2" rx="1" fill="#1a1a2e"/>
  <rect x="4" y="27" width="16" height="2" rx="1" fill="#ec4899" opacity="0.8"/>

  <!-- Tiny sparkle -->
  <text x="22" y="9" font-size="5" fill="#ec4899" opacity="0.7">✦</text>
</svg>
